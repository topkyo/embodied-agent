name: Nightly E2E Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright full e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:3001
          E2E_SITE_URL: http://127.0.0.1:5170
        run: npx playwright test
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
