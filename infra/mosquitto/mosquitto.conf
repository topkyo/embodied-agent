# NOT the docker stack runtime config — stack entry generates TLS-only 8883 at startup.
# Bare-metal broker config is produced by scripts/setup-bare-metal.sh (see deploy docs).
# Local dev uses aedes on 1883 (unchanged). Do not bind 1883 to 127.0.0.1 here for docker hardening.
listener 1883
allow_anonymous false
password_file /mosquitto/runtime/passwd
acl_file /mosquitto/runtime/acl
persistence false

# TLS (optional): mount certs and set listener 8883 in mosquitto-tls.conf overlay.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false