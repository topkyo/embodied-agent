[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  tzapu/WiFiManager@^2.0.17
  mikalhart/TinyGPSPlus@^1.0.3
build_flags =
  -DMQTT_HOST=\"${sysenv.MQTT_HOST}\"
  -DDEPLOYMENT_ID=\"dep-gh-pilot-001\"
  -DGPS_ENABLE=1
  -DGPS_RX_PIN=16
  -DGPS_TX_PIN=17
  -DGPS_BAUD=9600
  -DHEARTBEAT_INTERVAL_MS=30000
  -DDRY_RUN_GPIO=1
  ; 可选预分配 node_id：-DNODE_ID_ASSIGNED=1 -DNODE_ID=\"node-gh-001-a\"
  ; 无 GPS 模块时：-DGPS_ENABLE=0（heartbeat 仍上报，不含 gps 字段）
  ; API 地址默认与 MQTT_HOST 相同、端口 3001（见 node_reg.cpp API_HOST/API_PORT）

; Stack TLS（先运行 scripts/mosquitto-gen-certs.sh；自签证书用 MQTT_TLS_INSECURE）
[env:esp32dev-tls]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DMQTT_USE_TLS=1
  -DMQTT_TLS_INSECURE=1
  -DMQTT_PORT=8883

; Stack TLS + CA verify（docker stack 8883；交付须注入 MQTT_CA_CERT_PEM，空 PEM 不校验也不 setInsecure）
[env:esp32dev-tls-verify]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DMQTT_USE_TLS=1
  -DMQTT_PORT=8883
  -DMQTT_USERNAME=\"node\"
  -DMQTT_PASSWORD=\"${sysenv.MQTT_NODE_PASSWORD}\"
  -DMQTT_CA_CERT_PEM=\"${sysenv.MQTT_CA_CERT_PEM}\"

; Stack Mosquitto 认证（与 docker-compose MQTT_NODE_PASSWORD 一致）
[env:esp32dev-stack]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DMQTT_USERNAME=\"node\"
  -DMQTT_PASSWORD=\"${sysenv.MQTT_NODE_PASSWORD}\"

[env:esp32dev-tls-stack]
extends = env:esp32dev-tls
build_flags =
  ${env:esp32dev-tls.build_flags}
  -DMQTT_USERNAME=\"node\"
  -DMQTT_PASSWORD=\"${sysenv.MQTT_NODE_PASSWORD}\"

; 台架假负载：继电器/LED 接 GPIO，见 README「假负载接线」
[env:esp32dev-dummy]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DDRY_RUN_GPIO=0
  -DGPIO_VENT_LEFT_PIN=25
  -DGPIO_FAN_01_PIN=26
  -DGPIO_IRRIGATION_PIN=27
  -DGPIO_VENT_RIGHT_PIN=32